<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA DE CONTROLE DE ESTOQUE E ALERTA DE REPOSIÇÃO(MERCADINHO)</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <style>
        :root{
            --cor-fundo: rgb(22, 22, 22);
            --cor-secundária: rgb(163, 8, 8);
            --cor-secundária2: rgb(182, 38, 38);
            --cor-texto: white
        }
        html, body{
            background-image: url(img/fundo.avif);
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
           display: flex;
           flex-direction: column;
            
        }
       
        
  
        .menu{
            display: flex;
            
            max-width: 10000px;
            width: 100%;
            max-height: 80px;
            height: 100%;
            background-color: var(--cor-fundo);
            color: var(--cor-secundária);
            flex-direction: row;
            margin:0;
            align-items: center;
        }
        .menu a{
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            font-size: 2rem;
            padding-left: 2.5rem;
            padding-right: 2.5rem;
            text-decoration: none;
            border: solid var(--cor-secundária) 2px;
            border-radius: 5px;
            margin: 1rem;
            color: var(--cor-secundária);
            transition: 200ms;
        }
        .menu a:hover{
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            font-size: 2.5rem;
            padding-left: 3rem;
            padding-right: 3rem;
            text-decoration: none;
            border: solid var(--cor-secundária2) 2px;
            border-radius: 5px;
            margin: 1rem;
            color: var(--cor-secundária2);
            transition: 200ms;

        }       

        .fomulários{
            
           
            
            display: flex; 
            box-shadow: 0 0 20px var(--cor-secundária);
            align-items: center;
            flex-direction: column;
            max-width: 400px;
            width: 100%;
           
            background-color: var(--cor-fundo);
            border: double var(--cor-secundária) 2px;
        }
        .fomulários label{
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            font-size: 1rem;
            color: var(--cor-secundária);
            margin: 1%;
            cursor: default;
            text-decoration: underline;
            border: solid var(--cor-secundária) 2px;
            border-radius: 5px;
        }
        .fomulários input{
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            font-size: 1rem;
            color: var(--cor-secundária);
            margin: 1%;
            cursor: default;
            text-decoration: none;
            border: solid var(--cor-secundária) 2px;
            border-radius: 5px;
            background-color: var(--cor-fundo);

        }
        #mensagem_erro{
           display: none; /* Começa oculto */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        flex-direction: column;
        }
        .erro{
            padding: 1%;
            justify-content: center;
            top: 2%;
            position: fixed;
            align-items: center;
            text-align: center;
            background-color: rgb(226, 0, 0);
            color: white;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            font-size: 100%;
            width: 100%;
            height: 100%;
            max-width: 250px;
            max-height: 80px;
            border-radius: 2%;
            border: double black 2px;
            
            
            

        }
        .erro p{
            pointer-events: none;
            cursor: default;
            text-decoration: underline;
        }
        #fechar{
            background-color: red;
            border-radius: 5px;
            border: solid white 2px;
            

            
        }
        #fechar img{
            max-width: 25px;
            width: 90%;
        }
            main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
}
        
    footer {
        flex-shrink: 0;
        width: 100%;
        background-color: var(--cor-fundo);
        border-top: 2px solid var(--cor-secundária);
        padding: 15px 10px;
        text-align: center;
    }

    footer p {
        margin: 0 0 10px;
        font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        color: var(--cor-secundária);
    }

    .footer-links {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 8px;
    }

    .footer-links a {
        color: var(--cor-secundária);
        text-decoration: none;
        padding: 0 12px;
        border-right: 1px solid var(--cor-secundária);
    }

    .footer-links a:last-child {
        border-right: none;
    }

    @media (max-width: 600px) {
        .menu a {
            font-size: 1rem;
            padding: 7px 10px;
            margin: 3px;
        }

        .menu a:hover {
            font-size: 1.05rem;
        }

        main {
            padding: 25px 12px;
        }

        .tela {
            padding: 22px;
        }

        .footer-links a {
            padding: 0 8px;
        }
    }
        p{
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            cursor: none;
            color:  var(--cor-secundária);
            font-size: 100%;

        }
        button{
            margin: 2%;
            border: 5px double black;
            border-radius: 5px;
            background-color: var(--cor-fundo);
            box-shadow: 0 0 5px var(--cor-secundária);
            max-width: 100px;
            width: 100%;
            max-height: 40px;
            height: 100%;
        }
        #login{
            display: none;
            background-color: rgba(0, 0, 0, 0.746);
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center; 
        }
        
    .tela {
        width: 100%;
        max-width: 430px;
        background-color: rgba(22, 22, 22, 0.94);
        border: double var(--cor-secundária) 3px;
        border-radius: 10px;
        box-shadow:
            0 0 8px var(--cor-secundária),
            0 0 20px rgba(163, 8, 8, 0.45);
        padding: 30px;
    }

    .tela h1,
    .tela h2 {
        font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        color: var(--cor-secundária);
        text-align: center;
        margin-top: 0;
        text-shadow: 0 0 10px rgba(199, 8, 8, 0.5);
    }

    .tela label {
        display: block;
        font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        color: var(--cor-secundária);
        margin: 12px 0 5px;
    }

    .tela input {
        width: 100%;
        padding: 10px;
        font-size: 1rem;
        color: var(--cor-texto);
        background-color: #111;
        border: solid var(--cor-secundária) 2px;
        border-radius: 5px;
        outline: none;
    }

    .tela input:focus {
        border-color: var(--cor-secundária2);
        box-shadow: 0 0 10px rgba(182, 38, 38, 0.6);
    }
    .botao-principal {
        display: block;
        width: 100%;
        max-width: none;
        min-height: 45px;
        margin: 22px 0 12px;
        padding: 8px 15px;
        border: 3px double black;
        border-radius: 5px;
        background-color: var(--cor-fundo);
        color: var(--cor-secundária);
        box-shadow: 0 0 8px var(--cor-secundária);
        font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        cursor: pointer;
        transition: 200ms;
    }

    .botao-principal:hover {
        color: white;
        border-color: var(--cor-secundária2);
        box-shadow: 0 0 15px var(--cor-secundária2);
    }
     .link-acao {
        display: block;
        text-align: center;
        color: var(--cor-secundária);
        cursor: pointer;
        text-decoration: underline;
        font-family: Arial, sans-serif;
        margin-top: 12px;
    }
       .link-acao:hover {
        color: var(--cor-secundária2);
    }
       .dados {
        line-height: 1.6;
        font-family: Arial, sans-serif;
        font-size: 200%;
    }

    .dados strong {
        color: var(--cor-secundária2);
    }
      
       
    </style>
    
</head>
<body>
    <!-- Foco: pequeno Comércio Local

SITUAÇÃO PROBLEMA:

	um pequeno mercado de bairro perde produtos por falta de controle de estoque mínimo e não sabe quando fazer novos pedidos aos fornecedores, gerando perda de vendas.

CASO DE USO (UCO2 - CADASTRAR E VERIFICAR ESTOQUE):

ATORES: Atendente de Estoque

FLUXOS: O usuário cadastra produtos em um laço. Para cada item, insere nome, quantidade atual e quantidade mínima. O sistema utiliza operadores lógicos para emitir alertas e reposição urgente.

BACKLOG DO PRODUTO:

leitura contínua de produtos até solicitação de parada.
Verificação condicional ('quantidade < mínimo' AND 'mínimo > 0 ')
Classificação de status 'Crítico', 'Atenção', ou 'OK'
resumo final listando apenas os itens que precisam de compra urgente.


USER STORY:

"como comerciante, quero registrar a quantidade dos meus produtos e receber um alerta automático para os itens cujo estoque esteja abaixo do limite para não ficar sem mercadoria"
-->

<header>
<div class=" rounded gradient bg-dark menu" ><a href="">menu de gerenciamento</a>  
<a href="">contato</a>
<a href="">ver gráfico</a> 
<a href="">conta/empresa</a>

</div>
 <div class="dados">

 </div>
</header>
<main>
<form action="text" class="fomulários rounded gradient" id="telaSistema" style="display: none;">
    
    <label for="q_estoque">informe a quantidade em estoque atual:</label>
    <input type="text" name="" id="q_estoque">
    
    <label for="q_estoque_min">informe a quantidade mínima para o estoque:</label>
    <input type="text" name="" id="q_estoque_min">
    <button type="submit" class="botao-principal"><p>ENVIAR</p></button>
</form>

 <section id="telaLogin" class="tela">
            <h1>ENTRAR NO SISTEMA</h1>

            <form id="formLogin">
                <label for="emailLogin">E-mail:</label>
                <input type="email" id="emailLogin" required>

                <label for="senhaLogin">Senha:</label>
                <input type="password" id="senhaLogin" required>

                <button type="submit" class="botao-principal">
                    ENTRAR
                </button>
            </form>

            <span class="link-acao" onclick="mostrarCadastro()">
                Ainda não possui cadastro? Cadastre-se
            </span>

            <div id="erroLogin" class="mensagem"></div>
        </section>

 <section id="telaCadastro" class="tela" style="display: none;">
            <h2>CRIAR CADASTRO</h2>

            <form id="formCadastro">
                <label for="nomeCadastro">Nome:</label>
                <input type="text" id="nomeCadastro" required>

                <label for="emailCadastro">E-mail:</label>
                <input type="email" id="emailCadastro" required>

                <label for="senhaCadastro">Senha:</label>
                <input type="password" id="senhaCadastro" required>

                <label for="senhaConfirmacao">Confirme a senha:</label>
                <input type="password" id="senhaConfirmacao" required>

                <button type="submit" class="botao-principal">
                    CADASTRAR
                </button>
            </form>

            <span class="link-acao" onclick="mostrarLogin()">
                Já possui cadastro? Entrar
            </span>

            <div id="mensagemCadastro" class="mensagem"></div>
        </section>





<div id="mensagem_erro">
    <div class="erro"><p>valor inválido, tente novamente</p>
        
        <button onclick="document.getElementById('mensagem_erro').style.display='none'"id="fechar"><img src="img/fechar.png" alt="" ></button>
    </div>
</div>
</main>
<footer>
   <p>SISTEMA DE CONTROLE DE ESTOQUE</p>

        <div class="footer-links">
            <a href="#">Início</a>
            <a href="#">Contato</a>
            <a href="#">Ajuda</a>
            <a href="#">Conta</a>
        </div>

</footer>
<script>
     function mostrarCadastro() {
            document.getElementById("telaLogin").style.display = "none";
            document.getElementById("telaCadastro").style.display = "block";
            document.getElementById("telaSistema").style.display = "none";
        }

        function mostrarLogin() {
            document.getElementById("telaCadastro").style.display = "none";
            document.getElementById("telaLogin").style.display = "block";
            document.getElementById("telaSistema").style.display = "none";
        }

        function mostrarPainel(event) {
            if (event) event.preventDefault();

            const usuario = JSON.parse(localStorage.getItem("usuario"));

            if (!usuario) {
                mostrarLogin();
                return;
            }

            mostrarSistema(usuario);
        }

        function mostrarConta(event) {
            if (event) event.preventDefault();

            const usuario = JSON.parse(localStorage.getItem("usuario"));

            if (!usuario) {
                mostrarLogin();
                return;
            }

            mostrarSistema(usuario);
        }

        function mostrarSistema(usuario) {
            document.getElementById("telaLogin").style.display = "none";
            document.getElementById("telaCadastro").style.display = "none";
        }

        document.getElementById("formCadastro").addEventListener("submit", function(event) {
            event.preventDefault();

            const nome = document.getElementById("nomeCadastro").value.trim();
            const email = document.getElementById("emailCadastro").value.trim();
            const senha = document.getElementById("senhaCadastro").value;
            const confirmacao = document.getElementById("senhaConfirmacao").value;
            const mensagem = document.getElementById("mensagemCadastro");

            if (senha !== confirmacao) {
                mensagem.textContent = "As senhas não coincidem.";
                mensagem.style.display = "block";
                return;
            }

            const usuario = {
                nome: nome,
                email: email,
                senha: senha
            };

            localStorage.setItem("usuario", JSON.stringify(usuario));

            mensagem.textContent = "Cadastro realizado! Agora faça o login.";
            mensagem.style.display = "block";

            setTimeout(function() {
                mensagem.style.display = "none";
                mostrarLogin();
                document.getElementById("emailLogin").value = email;
            }, 1200);
        });

        document.getElementById("formLogin").addEventListener("submit", function(event) {
            event.preventDefault();

            const email = document.getElementById("emailLogin").value.trim();
            const senha = document.getElementById("senhaLogin").value;
            const usuario = JSON.parse(localStorage.getItem("usuario"));
            const mensagem = document.getElementById("erroLogin");

            if (!usuario) {
                mensagem.textContent = "Nenhum cadastro encontrado. Cadastre-se primeiro.";
                mensagem.style.display = "block";
                return;
            }

            if (email === usuario.email && senha === usuario.senha) {
                mensagem.style.display = "none";
                window.location.href="produtos.html"
            } else {
                mensagem.textContent = "E-mail ou senha incorretos.";
                mensagem.style.display = "block";
            }
        });

        function sair() {
            document.getElementById("telaSistema").style.display = "none";
            document.getElementById("telaLogin").style.display = "block";
            document.getElementById("formLogin").reset();
        }
</script>
<script src="codigin.js"></script>
<script src="js/bootstrap.min.js"></script>
</body>
</html>
